name: Complete multiuser foundation

on:
  push:
    branches: ["multi"]
    paths:
      - ".github/workflows/complete-multiuser-foundation.yml"
      - ".github/scripts/complete-multiuser-foundation.py"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout multi
        uses: actions/checkout@v6
        with:
          ref: multi
          fetch-depth: 0

      - name: Applica fondazione multiutente
        run: python3 .github/scripts/complete-multiuser-foundation.py

      - name: Verifica diff
        run: git diff --check

      - name: Commit e push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html database.rules.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
            exit 0
          fi
          git commit -m "Completa fondazione multiutente Firebase"
          git push origin HEAD:multi
