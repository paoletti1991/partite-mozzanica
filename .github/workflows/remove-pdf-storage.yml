name: Rimuove PDF e Storage

on:
  push:
    paths:
      - '.github/workflows/remove-pdf-storage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Applica modifica
        run: python .github/scripts/remove-pdf-storage.py
      - name: Verifica JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>\s*</body>', s)
          if not m:
              raise SystemExit('script applicativo non trovato')
          Path('/tmp/app.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Verifica assenza Storage/PDF
        run: |
          ! grep -R "firebase-storage.js\|ofi_file\|f_pdf\|fatture-acquisto/\|fatture-vendita/" public/index.html
          ! grep -q '"storage"' firebase.json
      - name: Rimuove file Storage e temporanei
        run: |
          rm -f storage.rules
          rm -f .github/scripts/remove-pdf-storage.py
          rm -f .github/workflows/remove-pdf-storage.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rimuove archiviazione PDF e Firebase Storage'
          git push
