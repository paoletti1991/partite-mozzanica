name: Fix eliminazione anagrafiche

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Applica fix e verifica sintassi
        run: python .github/scripts/fix-anag-delete.py
      - name: Rimuove file temporanei
        run: rm .github/scripts/fix-anag-delete.py .github/workflows/fix-anagrafiche-delete.yml
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/scripts/fix-anag-delete.py .github/workflows/fix-anagrafiche-delete.yml
          git commit -m "Abilita eliminazione sicura anagrafiche"
          git push origin HEAD:main
