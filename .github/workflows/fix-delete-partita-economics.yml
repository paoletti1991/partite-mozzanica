name: Fix deletePartita economics

on:
  push:
    branches: ["multi"]
    paths:
      - ".github/workflows/fix-delete-partita-economics.yml"
      - ".github/scripts/fix-delete-partita-economics.py"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout multi
        uses: actions/checkout@v6
        with:
          ref: multi
          fetch-depth: 0

      - name: Aggiorna deletePartita
        run: python3 .github/scripts/fix-delete-partita-economics.py

      - name: Verifica diff
        run: git diff --check

      - name: Commit e push su multi
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
            exit 0
          fi
          git commit -m "Allinea eliminazione partite con economics"
          git push origin HEAD:multi
