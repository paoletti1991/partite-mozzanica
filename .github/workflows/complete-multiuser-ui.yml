name: Complete multiuser UI

on:
  push:
    branches: ["multi"]
    paths:
      - ".github/workflows/complete-multiuser-ui.yml"
      - ".github/scripts/complete-multiuser-ui.py"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout multi
        uses: actions/checkout@v6
        with:
          ref: multi
          fetch-depth: 0
      - name: Applica UI e permessi
        run: python3 .github/scripts/complete-multiuser-ui.py
      - name: Verifica diff
        run: git diff --check
      - name: Commit e push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
            exit 0
          fi
          git commit -m "Completa UI e permessi multiutente"
          git push origin HEAD:multi
