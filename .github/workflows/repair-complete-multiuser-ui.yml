name: Repair and complete multiuser UI

on:
  push:
    branches: ["multi"]
    paths:
      - ".github/workflows/repair-complete-multiuser-ui.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout multi
        uses: actions/checkout@v6
        with:
          ref: multi
          fetch-depth: 0
      - name: Rende robusto inserimento guardie
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/complete-multiuser-ui.py')
          s=p.read_text(encoding='utf-8')
          old="""def insert_guard(signature,guard,label):
              global text
              old=signature+'\\n'
              new=signature+'\\n  '+guard+'\\n'
              rep(old,new,label)
          """
          new="""def insert_guard(signature,guard,label):
              global text
              n=text.count(signature)
              if n!=1: raise RuntimeError(f'{label}: expected 1 signature, found {n}')
              text=text.replace(signature,signature+'\\n  '+guard,1)
          """
          if old not in s:
              raise SystemExit('helper insert_guard non trovato')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Applica UI e permessi
        run: python3 .github/scripts/complete-multiuser-ui.py
      - name: Verifica diff
        run: git diff --check
      - name: Commit e push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/scripts/complete-multiuser-ui.py
          git commit -m "Completa UI e permessi multiutente"
          git push origin HEAD:multi
