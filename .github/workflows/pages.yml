name: Pubblica Registro RAEE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Preleva i file
        uses: actions/checkout@v6
      - name: Prepara fatture operatori
        run: python .github/scripts/operator-invoice-amounts.py
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
