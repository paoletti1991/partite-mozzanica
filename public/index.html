<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro Partite · Mozzanica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F4F0; --panel:#FBFAF7; --ink:#16181D; --muted:#5C5F68;
  --graphite:#22262F; --graphite-2:#2C313C; --line:#DEDBD2; --line-2:#EAE7DF;
  --brass:#A5793A; --brass-lt:#C6A05A; --brass-wash:#F2E9D8;
  --green:#2C7A57; --green-wash:#E4F0E9; --red:#BB3A27; --red-wash:#F6E3DF;
  --amber:#B57C15; --amber-wash:#F7ECD3; --blue:#37566E;
  --r:6px; --r-lg:10px;
  --sh:0 1px 2px rgba(20,24,29,.06),0 2px 8px rgba(20,24,29,.05);
  --sh-lg:0 6px 24px rgba(20,24,29,.13);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--brass);text-decoration:none}
::selection{background:var(--brass-wash)}

/* ===== LAYOUT ===== */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{
  background:var(--graphite);color:#D6D9E0;padding:0;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
}
.brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .mk{font-family:'Space Grotesk';font-weight:700;font-size:15px;color:#fff;letter-spacing:.02em;display:flex;align-items:center;gap:9px}
.brand .dot{width:10px;height:10px;border-radius:2px;background:var(--brass-lt);box-shadow:0 0 0 3px rgba(198,160,90,.2)}
.brand .sub{font-size:11px;color:#8990A0;margin-top:5px;letter-spacing:.04em;text-transform:uppercase}
.nav{padding:12px 12px;flex:1;overflow-y:auto}
.nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#6C7383;padding:14px 10px 6px}
.nav a{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r);color:#C2C7D2;
  font-size:13.5px;font-weight:450;margin:1px 0;transition:background .12s,color .12s;
}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--brass);color:#fff;font-weight:500}
.nav a.on .ico{opacity:1}
.nav .ico{width:17px;height:17px;flex:none;opacity:.72}
.nav a .badge{margin-left:auto;background:rgba(255,255,255,.14);border-radius:20px;padding:1px 7px;font-size:11px;font-weight:600}
.nav a.warnb .badge{background:var(--amber);color:#2a1e05}
.side .foot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#6C7383}
.side .foot .store{display:flex;align-items:center;gap:7px}
.side .foot .st-dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.side .foot .st-dot.cloud{background:#4a9d6f}
.side .foot .st-dot.error{background:var(--red)}
.side .foot .store{cursor:pointer}.side .foot .store:hover{color:#C2C7D2}

.main{padding:0;min-width:0;overflow-x:hidden}
.topbar{
  display:flex;align-items:center;gap:16px;padding:18px 34px;border-bottom:1px solid var(--line);
  background:var(--paper);position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:20px;font-weight:600}
.topbar .crumb{font-size:12px;color:var(--muted);letter-spacing:.02em}
.topbar .sp{flex:1}
.yearsel{display:flex;gap:2px;background:var(--line-2);padding:3px;border-radius:var(--r);border:1px solid var(--line)}
.yearsel button{
  border:none;background:transparent;padding:5px 12px;border-radius:4px;font-size:13px;font-weight:500;
  color:var(--muted);font-family:'IBM Plex Mono'
}
.yearsel button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.content{padding:28px 34px 80px}

/* ===== BUTTONS ===== */
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:8px 14px;border-radius:var(--r);font-size:13.5px;font-weight:500;box-shadow:var(--sh);transition:.12s
}
.btn:hover{border-color:#c8c3b6;transform:translateY(-1px)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#fff}
.btn.primary:hover{background:#96702f}
.btn.dark{background:var(--graphite);border-color:var(--graphite);color:#fff}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--line-2);color:var(--ink);transform:none}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{color:var(--red);border-color:var(--red-wash)}
.btn.danger:hover{background:var(--red-wash)}

/* ===== KPI CARDS ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:26px}
.kpi{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;position:relative;overflow:hidden
}
.kpi .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .val{font-family:'Space Grotesk';font-size:27px;font-weight:600;margin-top:8px;letter-spacing:-.02em}
.kpi .val small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:3px}
.kpi.accent{border-top:3px solid var(--brass)}
.kpi .val.pos{color:var(--green)} .kpi .val.neg{color:var(--red)}
.kpi .edge{position:absolute;right:-10px;top:-10px;font-family:'IBM Plex Mono';font-size:60px;color:var(--line-2);font-weight:600;line-height:1;user-select:none}

/* dashboard */
.dash-hero{background:linear-gradient(125deg,var(--graphite),#343a46);color:#fff;border-radius:var(--r-lg);padding:22px 24px;margin-bottom:18px;display:flex;align-items:center;gap:22px;box-shadow:var(--sh)}
.dash-hero .intro{flex:1;min-width:260px}.dash-hero .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--brass-lt);font-weight:700}
.dash-hero h2{font-size:24px;margin-top:3px}.dash-hero .desc{font-size:12.5px;color:#B8BEC9;margin-top:5px}
.dash-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.dash-actions .btn{box-shadow:none}.dash-actions .btn.ghost-light{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:#fff}
.dash-ring{--p:0%;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--brass-lt) var(--p),rgba(255,255,255,.12) 0);position:relative;display:grid;place-items:center;flex:none}
.dash-ring::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--graphite-2)}
.dash-ring .inside{position:relative;z-index:1;text-align:center}.dash-ring .n{font-family:'Space Grotesk';font-weight:700;font-size:24px}.dash-ring .l{font-size:9.5px;line-height:1.2;text-transform:uppercase;letter-spacing:.06em;color:#AEB5C1;max-width:72px}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.85fr);gap:18px;margin-bottom:22px}.dash-grid.equal{grid-template-columns:1fr 1fr}
.panel-b{padding:18px 20px}.dash-kpis{grid-template-columns:repeat(3,minmax(180px,1fr));margin-bottom:18px}
.dash-kpis .kpi{min-height:118px;padding-left:62px}.kpi-ico{position:absolute;left:17px;top:17px;width:32px;height:32px;border-radius:8px;background:var(--line-2);color:var(--brass);display:grid;place-items:center}.kpi-ico svg{width:17px;height:17px}
.kpi.warn-card{border-color:#e5cf9c;background:linear-gradient(135deg,var(--panel),var(--amber-wash))}.kpi.warn-card .kpi-ico{background:#f0dcae;color:var(--amber)}
.material-meter{height:12px;background:var(--line-2);border-radius:20px;overflow:hidden;display:flex;margin:8px 0 15px}.material-meter span{height:100%}.material-meter .out{background:var(--green)}.material-meter .stock{background:var(--brass)}
.flow-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.flow-stat{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:11px}.flow-stat .n{font-family:'Space Grotesk';font-size:20px;font-weight:650}.flow-stat .l{font-size:11px;color:var(--muted);margin-top:1px}.flow-stat .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.flow-stat .dot.stock{background:var(--line)}.flow-stat .dot.partial{background:var(--brass)}.flow-stat .dot.closed{background:var(--green)}
.dash-footnote{font-size:11px;color:var(--muted);margin-top:10px}.dash-footnote b{color:var(--ink)}
.attention-list{display:flex;flex-direction:column}.attention-item{display:grid;grid-template-columns:36px 1fr auto;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2);cursor:pointer}.attention-item:last-child{border-bottom:none}.attention-item:hover .attention-title{color:var(--brass)}
.attention-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--amber-wash);color:var(--amber)}.attention-icon svg{width:16px;height:16px}.attention-icon.green{background:var(--green-wash);color:var(--green)}.attention-icon.grey{background:var(--line-2);color:var(--muted)}
.attention-title{font-weight:600;font-size:12.5px}.attention-sub{font-size:11.5px;color:var(--muted);margin-top:1px}.attention-value{font-family:'IBM Plex Mono';font-weight:600;font-size:13px;white-space:nowrap}
.metric-bars{display:flex;flex-direction:column;gap:12px}.metric-row{display:grid;grid-template-columns:128px 1fr 112px;gap:12px;align-items:center}.metric-row .label{font-size:12px;color:var(--muted)}.metric-track{height:11px;background:var(--line-2);border-radius:12px;overflow:hidden}.metric-fill{height:100%;border-radius:12px;min-width:2px;background:var(--green)}.metric-fill.neg{background:var(--red)}.metric-fill.net{background:var(--brass)}.metric-row .amount{text-align:right;font-family:'IBM Plex Mono';font-size:12px;font-weight:600}
.stock-bars{display:flex;flex-direction:column;gap:12px}.stock-row{display:grid;grid-template-columns:95px 1fr 94px;gap:10px;align-items:center}.stock-row .cer-code{font-family:'IBM Plex Mono';font-size:11.5px;font-weight:600}.stock-track{height:18px;border-radius:4px;background:var(--line-2);overflow:hidden}.stock-fill{height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-lt));border-radius:4px}.stock-row .amount{text-align:right;font-family:'IBM Plex Mono';font-size:11.5px}
.dash-empty{padding:24px 10px;text-align:center;color:var(--muted);font-size:12px}.dash-empty b{display:block;color:var(--ink);font-family:'Space Grotesk';font-size:14px;margin-bottom:3px}
@media(max-width:1180px){.dash-kpis{grid-template-columns:repeat(2,minmax(180px,1fr))}.dash-grid,.dash-grid.equal{grid-template-columns:1fr}}
@media(max-width:760px){.dash-hero{align-items:flex-start;flex-wrap:wrap}.dash-ring{width:96px;height:96px}.dash-kpis{grid-template-columns:1fr}.flow-legend{grid-template-columns:1fr}.metric-row{grid-template-columns:105px 1fr 92px}.stock-row{grid-template-columns:80px 1fr 86px}}

/* ===== PANELS / TABLES ===== */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:22px}
.panel-h{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:15px}
.panel-h .sp{flex:1}
.panel-h .cnt{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono'}
table{width:100%;border-collapse:collapse}
.table-scroll{width:100%;overflow-x:auto}.table-scroll table{min-width:1080px}
th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--line-2);white-space:nowrap
}
td{padding:12px 14px;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--brass-wash)}
.tag{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;
  font-family:'IBM Plex Mono';letter-spacing:.01em;white-space:nowrap
}
.tag.cer{background:var(--graphite);color:#fff}
.tag.haz{background:var(--red-wash);color:var(--red)}
.tag.green{background:var(--green-wash);color:var(--green)}
.tag.amber{background:var(--amber-wash);color:var(--amber)}
.tag.grey{background:var(--line-2);color:var(--muted)}
.tag.brass{background:var(--brass-wash);color:var(--brass)}
.tag.blue{background:#E3EAEF;color:var(--blue)}
.pnum{font-family:'Space Grotesk';font-weight:600;font-size:15px;color:var(--ink);white-space:nowrap}
.pnum .r{color:var(--brass);font-size:12px;font-weight:500}
.empty{padding:52px 20px;text-align:center;color:var(--muted)}
.empty .big{font-family:'Space Grotesk';font-size:16px;color:var(--ink);margin-bottom:4px}

/* progress flow bar */
.flow{display:flex;align-items:center;gap:0;font-size:11px;font-family:'IBM Plex Mono'}
.flow .step{display:flex;align-items:center;gap:6px;padding:2px 8px;color:var(--muted)}
.flow .step .b{width:8px;height:8px;border-radius:50%;background:var(--line);border:1px solid #cfcabb}
.flow .step.done{color:var(--ink)}
.flow .step.done .b{background:var(--brass);border-color:var(--brass)}
.flow .arw{color:var(--line);font-size:10px}

/* ===== DETAIL ===== */
.det-head{display:flex;align-items:flex-start;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.det-head .idbox{
  background:var(--graphite);color:#fff;border-radius:var(--r-lg);padding:16px 22px;min-width:150px
}
.det-head .idbox .n{font-family:'Space Grotesk';font-size:30px;font-weight:700;line-height:1}
.det-head .idbox .n .r{color:var(--brass-lt);font-size:16px}
.det-head .idbox .y{font-family:'IBM Plex Mono';font-size:12px;color:#9aa0af;margin-top:6px}
.det-head .meta{flex:1;min-width:240px}
.det-head .meta .prod{font-family:'Space Grotesk';font-size:20px;font-weight:600}
.det-head .meta .row{display:flex;gap:20px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:13px}
.det-head .meta .row b{color:var(--ink);font-weight:600}
.det-grid{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
@media(max-width:1000px){.det-grid{grid-template-columns:1fr}}

.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:20px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);background:var(--line-2)}
.sec-h h4{font-size:13.5px;text-transform:uppercase;letter-spacing:.05em}
.sec-h .sp{flex:1}
.sec-b{padding:16px 18px}
.sec-b.pad0{padding:0}

.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)} .kv .v{font-weight:500;text-align:right}

/* traceability tree */
.tree{padding:6px 4px}
.tnode{position:relative;padding-left:26px;margin:2px 0}
.tnode::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.tnode:last-child::before{bottom:auto;height:16px}
.tnode .tdot{position:absolute;left:2px;top:11px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--brass)}
.tnode.out .tdot{border-color:var(--green)}
.tnode.lav .tdot{border-color:var(--blue)}
.tnode .tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;margin:2px 0}
.tnode .tt{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.tnode .ts{font-size:11.5px;color:var(--muted);margin-top:2px;font-family:'IBM Plex Mono'}

.linkbtn{background:none;border:none;color:var(--brass);font-weight:600;font-size:13px;padding:0;cursor:pointer}
.mini{font-size:12px;color:var(--muted)}
.pill-file{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12px;margin:3px 4px 0 0}
.pill-file svg{width:13px;height:13px;color:var(--red)}

/* ===== MODAL ===== */
.overlay{position:fixed;inset:0;background:rgba(20,24,29,.5);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--paper);border-radius:14px;box-shadow:var(--sh-lg);width:100%;max-width:640px;overflow:hidden;animation:pop .18s ease}
.modal.wide{max-width:840px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.modal-h h3{font-size:17px}
.modal-h .x{margin-left:auto;border:none;background:none;font-size:22px;color:var(--muted);line-height:1;padding:4px 8px;border-radius:6px}
.modal-h .x:hover{background:var(--line-2);color:var(--ink)}
.modal-b{padding:22px 24px;max-height:70vh;overflow-y:auto}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--line);background:var(--panel)}

.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:5px}
.field label .req{color:var(--red)}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.inp,select.inp,textarea.inp{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fff;color:var(--ink)
}
.inp:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-wash)}
.inp.mono{font-family:'IBM Plex Mono'}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.inline-add{display:flex;gap:8px;align-items:flex-end}

/* CER combobox */
.combo{position:relative}
.combo .list{
  position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh-lg);max-height:280px;overflow-y:auto;z-index:5;display:none
}
.combo.open .list{display:block}
.combo .opt{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line-2);display:flex;gap:10px;align-items:baseline}
.combo .opt:hover,.combo .opt.hi{background:var(--brass-wash)}
.combo .opt .c{font-family:'IBM Plex Mono';font-weight:600;font-size:13px;white-space:nowrap}
.combo .opt .d{font-size:12px;color:var(--muted);line-height:1.35}
.combo .opt.chap{background:var(--graphite);color:#fff;font-family:'Space Grotesk';font-size:11px;text-transform:uppercase;letter-spacing:.04em;cursor:default;position:sticky;top:0}
.combo .opt.chap:hover{background:var(--graphite)}
.combo .opt .star{color:var(--red);font-weight:700}

.vies-box{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:#fff;margin-top:4px}
.vies-box.ok{border-color:var(--green);background:var(--green-wash)}
.vies-box.err{border-color:var(--amber);background:var(--amber-wash)}
.vies-box .t{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}

.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;user-select:none;padding:4px 0}
.chk input{width:16px;height:16px;accent-color:var(--brass)}

.selrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:#fff}
.selrow .kg{margin-left:auto;display:flex;align-items:center;gap:8px}
.selrow .kg input{width:92px}
.avail{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono'}

.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:120px 1fr 90px;gap:12px;align-items:center;font-size:12.5px}

.bar-fill{position:absolute;top:0;left:0;bottom:0;border-radius:20px;background:var(--brass);display:flex;align-items:center;padding-left:8px;color:#fff;font-size:11px;font-family:'IBM Plex Mono'}

.ff{display:flex;flex-direction:column;gap:5px;min-width:150px}

.ff label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

.trace-report .rep-sub{color:var(--muted);margin-bottom:18px}

     async migrateLegacyToBranches(){

  if(!legacySnap.exists()){
    throw new Error('Archivio precedente non trovato');
  }

    'counters',

  if(existing.some(snap=>snap.exists())){
    throw new Error(
      'Migrazione interrotta: una o più nuove sezioni contengono già dati'
    );
  }

  const partiteOperative={};
  const documentiOperativi={};

  const economics={
    partite:{},

    delete p.trasportoIngresso;

    partiteOperative[id]=p;
  });

  Object.entries(legacy.documenti||{}).forEach(([id,source])=>{

    economics.documenti[id]={
      trasportoCosto:d.trasportoCosto||0,

    };

    delete d.trasportoCosto;
    delete d.valorizzazione;
    delete d.naturaEconomicaBozza;
    delete d.fatturaCliente;
    delete d.fatturaCosto;

    documentiOperativi[id]=d;
  });

  const updates={
    partite:partiteOperative,

    produttori:legacy.produttori||{},
    trasportatori:legacy.trasportatori||{},
    counters:legacy.counters||{},

  };

  await dbMod.update(registroRef,updates);

  return {
    partite:Object.keys(partiteOperative).length,

    produttori:Object.keys(legacy.produttori||{}).length,
    trasportatori:Object.keys(legacy.trasportatori||{}).length
  };
},

const FB_ON = !!(firebaseConfig&&firebaseConfig.apiKey&&firebaseConfig.projectId&&firebaseConfig.databaseURL);
const LS_KEY='valmet_raee_v1', LS_PREV_KEY='valmet_raee_previous_v1';
let DB=emptyDB();
let CLOUD={configured:FB_ON,user:null,profile:null,ready:false,syncing:false,lastSync:0,error:'',unsubscribe:null};

function emptyDB(){
  return {
    partite:{},
    produttori:{},
    trasportatori:{},
    documenti:{},
    counters:{},
    economics:{
      partite:{},
      documenti:{}
    },
    _meta:{
      schemaVersion:3,
      updatedAt:Date.now()
    }
  };
}
function normalizeDB(data){
  const d=(data&&typeof data==='object')?data:emptyDB();

  ['partite','produttori','trasportatori','documenti','counters']
    .forEach(k=>d[k]=d[k]||{});

  d.economics=d.economics||{};
  d.economics.partite=d.economics.partite||{};
  d.economics.documenti=d.economics.documenti||{};

  d._meta=d._meta||{};
  d._meta.schemaVersion=3;
  d._meta.updatedAt=+d._meta.updatedAt||Date.now();

  return d;
}
  function partitaEconomicsData(p){
  if(!p){
    return {
      fattureAcquisto:[],
      definizioniFornitore:[],
      trasportoIngresso:null
    };
  }

  const stored=DB.economics?.partite?.[p.id];

  if(stored){
    return {
      fattureAcquisto:stored.fattureAcquisto||[],
      definizioniFornitore:stored.definizioniFornitore||[],
      trasportoIngresso:stored.trasportoIngresso||null
    };
  }

  // Compatibilità temporanea con il vecchio archivio
  return {
    fattureAcquisto:p.fattureAcquisto||[],
    definizioniFornitore:p.definizioniFornitore||[],
    trasportoIngresso:p.trasportoIngresso||null
  };
}

function documentoEconomicsData(d){
  if(!d){
    return {
      trasportoCosto:0,
      valorizzazione:null,
      naturaEconomicaBozza:null,
      fatturaCliente:null,
      fatturaCosto:null
    };
  }

  const stored=DB.economics?.documenti?.[d.id];

  if(stored){
    return {
      trasportoCosto:+stored.trasportoCosto||0,
      valorizzazione:stored.valorizzazione||null,
      naturaEconomicaBozza:stored.naturaEconomicaBozza||null,
      fatturaCliente:stored.fatturaCliente||null,
      fatturaCosto:stored.fatturaCosto||null
    };
  }

  // Compatibilità temporanea con il vecchio archivio
  return {
    trasportoCosto:+d.trasportoCosto||0,
    valorizzazione:d.valorizzazione||null,
    naturaEconomicaBozza:d.naturaEconomicaBozza||null,
    fatturaCliente:d.fatturaCliente||null,
    fatturaCosto:d.fatturaCosto||null
  };
}

function ensurePartitaEconomics(p){
  if(!p) return null;

  DB.economics=DB.economics||{};
  DB.economics.partite=DB.economics.partite||{};

  if(!DB.economics.partite[p.id]){
    const current=partitaEconomicsData(p);

    DB.economics.partite[p.id]={
      fattureAcquisto:JSON.parse(
        JSON.stringify(current.fattureAcquisto||[])
      ),
      definizioniFornitore:JSON.parse(
        JSON.stringify(current.definizioniFornitore||[])
      ),
      trasportoIngresso:current.trasportoIngresso
        ? JSON.parse(JSON.stringify(current.trasportoIngresso))
        : null
    };
  }

  return DB.economics.partite[p.id];
}

function ensureDocumentoEconomics(d){
  if(!d) return null;

  DB.economics=DB.economics||{};
  DB.economics.documenti=DB.economics.documenti||{};

  if(!DB.economics.documenti[d.id]){
    const current=documentoEconomicsData(d);

    DB.economics.documenti[d.id]={
      trasportoCosto:+current.trasportoCosto||0,
      valorizzazione:current.valorizzazione
        ? JSON.parse(JSON.stringify(current.valorizzazione))
        : null,
      naturaEconomicaBozza:current.naturaEconomicaBozza||null,
      fatturaCliente:current.fatturaCliente
        ? JSON.parse(JSON.stringify(current.fatturaCliente))
        : null,
      fatturaCosto:current.fatturaCosto
        ? JSON.parse(JSON.stringify(current.fatturaCosto))
        : null
    };
  }

  return DB.economics.documenti[d.id];
}
function hasBusinessData(data){return !!(data&&(Object.keys(data.partite||{}).length||Object.keys(data.documenti||{}).length||Object.keys(data.produttori||{}).length||Object.keys(data.trasportatori||{}).length));}
function load(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw)DB=normalizeDB(JSON.parse(raw));else DB=emptyDB();}catch(e){DB=emptyDB();}
}
function persistLocal(data,keepPrevious){
  try{
    const next=JSON.stringify(data), current=localStorage.getItem(LS_KEY);
    if(keepPrevious&&current&&current!==next)localStorage.setItem(LS_PREV_KEY,current);
    localStorage.setItem(LS_KEY,next);return true;
  }catch(e){toast('Copia locale non riuscita: spazio browser insufficiente','err');return false;}
}
function save(){
  DB=normalizeDB(DB);DB._meta.updatedAt=Date.now();DB._meta.device='browser';
  if(!persistLocal(DB,true))return false;
  queueCloudSave();updateStoreStatus();return true;
}
function queueCloudSave(){
  if(!CLOUD.user||!window.firebaseBridge)return;
  clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(pushCloud,450);
}
async function pushCloud(){
  if(!CLOUD.user||!window.firebaseBridge)return;
  CLOUD.syncing=true;CLOUD.error='';updateStoreStatus();
  const payload=JSON.parse(JSON.stringify(DB));
  try{await window.firebaseBridge.write(payload);CLOUD.lastSync=Date.now();}
  catch(e){CLOUD.error='Sincronizzazione non riuscita; dati conservati in locale';}
  finally{CLOUD.syncing=false;updateStoreStatus();}
}
function applyCloudData(wrapper){
  if(!wrapper||!wrapper.data)return false;
  const incoming=normalizeDB(wrapper.data);incoming._meta.updatedAt=+wrapper.updatedAt||+incoming._meta.updatedAt||Date.now();
  DB=incoming;persistLocal(DB,true);render();return true;
}
async function syncInitialCloud(){
  if(!CLOUD.user||!window.firebaseBridge)return;
  CLOUD.syncing=true;updateStoreStatus();
  try{
    const remote=await window.firebaseBridge.read();
    const remoteTs=+(remote?.updatedAt||remote?.data?._meta?.updatedAt||0), localTs=+(DB._meta?.updatedAt||0);
    if(remote?.data&&(!hasBusinessData(DB)||remoteTs>localTs))applyCloudData(remote);
    else if(hasBusinessData(DB)||!remote?.data)await window.firebaseBridge.write(JSON.parse(JSON.stringify(DB)));
    CLOUD.lastSync=Date.now();CLOUD.error='';
    if(CLOUD.unsubscribe)CLOUD.unsubscribe();
    CLOUD.unsubscribe=window.firebaseBridge.listen(next=>{
      const ts=+(next?.updatedAt||next?.data?._meta?.updatedAt||0);
      if(next?.data&&ts>+(DB._meta?.updatedAt||0))applyCloudData(next);
    });
  }catch(e){CLOUD.error='Accesso cloud non disponibile; copia locale attiva';}
  finally{CLOUD.syncing=false;updateStoreStatus();}
}
function initCloudBridge(){
  if(CLOUD.ready)return;
  if(!window.firebaseBridge){updateStoreStatus();return;}
  CLOUD.ready=true;

  window.firebaseBridge.onAuth(async user=>{
    CLOUD.user=user||null;
    CLOUD.profile=null;
    CLOUD.error='';

    if(CLOUD.unsubscribe){
      CLOUD.unsubscribe();
      CLOUD.unsubscribe=null;
    }

    if(!user){
      DB=emptyDB();
      updateStoreStatus();
      render();
      return;
    }

    try{
      const profile=await window.firebaseBridge.readUserProfile(user.uid);

      if(!profile || profile.active!==true){
        DB=emptyDB();
        CLOUD.error='Utente non autorizzato';
        updateStoreStatus();
        render();
        return;
      }

      CLOUD.profile=profile;

      if(profile.role==='admin'){
        await syncInitialCloud();
      }else{
        DB=emptyDB();
      }

      updateStoreStatus();
      render();

    }catch(e){
      DB=emptyDB();
      CLOUD.error='Profilo utente non disponibile';
      updateStoreStatus();
      render();
    }
  });
}
window.addEventListener('firebase-bridge-ready',e=>{

});

function hasPermission(section,action='read'){

/* ---------- FORMAT ---------- */

/* €/kg d'ingresso della partita = Σ fatture acquisto / kg ingresso */
function eurokgIngresso(p){
  const eco=partitaEconomicsData(p);

  const fatture=(eco.fattureAcquisto||[])
    .reduce((s,f)=>s+(+f.importo||0),0);

  if(fatture>0 && p.kgIngresso){
    return fatture/p.kgIngresso;
  }

  const defs=eco.definizioniFornitore||[];
  const tot=defs.reduce((s,d)=>s+(+d.importo||0),0);
  const kgDef=defs.reduce((s,d)=>s+(+d.kg||0),0);

  return defs.length&&kgDef>0 ? tot/kgDef : null;
}

function costoAcquisto(p){
  const eco=partitaEconomicsData(p);

  const fatture=(eco.fattureAcquisto||[])
    .reduce((s,f)=>s+(+f.importo||0),0);

  return fatture>0
    ? fatture
    : (eco.definizioniFornitore||[])
        .reduce((s,d)=>s+(+d.importo||0),0);
}

/* lotti disponibili al netto di lavorazioni parziali e uscite */
function lottiDisponibili(p){
  const lotti = [{key:'tq',cer:p.cer,kg:+p.kgIngresso||0,label:'Tal quale non lavorato'}];
  const addLot=(lot)=>{
    const old=lotti.find(x=>x.key===lot.key);
    if(old) old.kg+=(+lot.kg||0); else lotti.push(lot);
  };
  (p.lavorazioni||[]).forEach(l=>{
    if(l.partialV2){
      const source=lotti.find(x=>x.key===(l.lottoOrigine||'tq'));
      if(source) source.kg-=(+l.kgLavorati||+l.pesoPrima||0);
      if(l.frazioni && l.frazioni.length){
        l.frazioni.forEach(fr=>addLot({key:fr.id,cer:fr.cer||l.cerOrigine||p.cer,kg:+fr.kg||0,label:fr.label||'Frazione'}));
      }else if((+l.pesoDopo||0)>0){
        addLot({key:l.lottoProdotto||l.id+'_out',cer:l.cerProdotto||l.cerOrigine||p.cer,kg:+l.pesoDopo||0,label:l.lottoProdottoLabel||(l.tipo==='trit'?'Triturato':'Selezionato')});
      }
    }else{
      /* compatibilità con le lavorazioni create dalle versioni precedenti */
      const tq=lotti.find(x=>x.key==='tq');
      if(l.frazioni && l.frazioni.length){
        if(tq) tq.kg=0;
        l.frazioni.forEach(fr=>addLot({key:fr.id,cer:fr.cer||p.cer,kg:+fr.kg||0,label:fr.label||'Frazione'}));
      }else if(tq && l.pesoDopo!=null){ tq.kg=+l.pesoDopo||0; }
    }
  });
  // sottrai uscite
  Object.values(DB.documenti).forEach(d=>{
    (d.righe||[]).forEach(r=>{
      if(r.partitaId===p.id){
        const lot = lotti.find(x=>x.key===(r.lotto||'tq'));
        if(lot) lot.kg -= (+r.kg||0);
      }
    });
  });
  return lotti;
}
function giacenza(p){ return lottiDisponibili(p).reduce((s,l)=>s+Math.max(0,l.kg),0); }
function kgUsciti(p){
  let t=0; Object.values(DB.documenti).forEach(d=> (d.righe||[]).forEach(r=>{ if(r.partitaId===p.id) t+=(+r.kg||0); }));

function naturaValorizzazione(d){
  if(!d) return 'ricavo';

  const eco=documentoEconomicsData(d);

  return (
    (eco.valorizzazione && eco.valorizzazione.natura==='costo') ||
    eco.naturaEconomicaBozza==='costo' ||
    (!eco.valorizzazione && eco.fatturaCosto && !eco.fatturaCliente)
  ) ? 'costo' : 'ricavo';
}

function uscitaValorizzata(d){
  if(!d) return false;

  const eco=documentoEconomicsData(d);

  return !!(
    eco.valorizzazione &&
    Number.isFinite(+eco.valorizzazione.valoreRiconosciuto) &&
    +eco.valorizzazione.valoreRiconosciuto>0
  );
}

function documentoEconomicoUscita(d){
  if(!d) return null;

function documentoIngressoLabel(p){
  const docs=(p.formulariIngresso||[]).map(f=>`${f.numero||'—'}${f.data?' · '+dfmt(f.data):''}`);
  return docs.join(', ')||'Nessun documento di entrata';
}
function documentiClienteFatturati(p){
  if(!p) return [];

  return Object.values(DB.documenti).filter(d=>{
    const eco=documentoEconomicsData(d);

    return (
      eco.valorizzazione &&
      naturaValorizzazione(d)==='ricavo' &&
      (+eco.valorizzazione.valoreRiconosciuto||0)>0 &&
      eco.fatturaCliente &&
      String(eco.fatturaCliente.numero||'').trim() &&
      (d.righe||[]).some(r=>r.partitaId===p.id)
    );
  });
}
function quotaClienteKey(d,r,index){ return r.id||`${d.id}|${index}|${r.partitaId}|${r.lotto||'tq'}`; }
function quoteClienteFatturate(p){
  const out=[];
  documentiClienteFatturati(p).forEach(d=>{
    const rip=ripartizioneDoc(d);
    rip.righe.forEach((x,index)=>{ if(x.r.partitaId===p.id) out.push({key:quotaClienteKey(d,x.r,index),d,r:x.r,kg:x.kg,quotaCliente:x.quota}); });
  });

function quoteDaDefinireConFornitore(p){
  if(!p) return [];

  const ecoPartita=partitaEconomicsData(p);

  if(!(ecoPartita.fattureAcquisto||[])
    .some(f=>Number.isFinite(+f.importo)&&+f.importo>0)){
    return [];
  }

  const out=[];

  Object.values(DB.documenti).forEach(d=>{
    if(uscitaValorizzata(d)) return;

    (d.righe||[]).forEach((r,index)=>{
      if(r.partitaId===p.id){
        out.push({
          key:quotaClienteKey(d,r,index),
          d,
          r,
          kg:+r.kg||0
        });
      }
    });
  });

  return out;
}
function partitaDaDefinireConFornitore(p){
  return !!p && (+p.kgIngresso||0)>0 && quoteDaDefinireConFornitore(p).length>0;
}
function fattureClienteLabel(p){
  return [
    ...new Set(
      documentiClienteFatturati(p)
        .map(d=>documentoEconomicsData(d).fatturaCliente?.numero)

}

function fattureAcquistoValorizzateLabel(p){
  const eco=partitaEconomicsData(p);

  return [

  ].join(', ') || 'fattura d’acquisto valorizzata';
}

/* valorizzazione proporzionale di un documento:
   quota_i = V * (kg_i * €/kg_ingresso_i) / Σ(kg*€/kg). Fallback: kg-proporzionale */
function ripartizioneDoc(d){
  const eco=documentoEconomicsData(d);

  const importo=eco.valorizzazione
    ? Math.abs(+eco.valorizzazione.valoreRiconosciuto||0)
    : 0;

  const V=naturaValorizzazione(d)==='costo'
    ? -importo
    : importo;

  const righe=(d.righe||[]).map(r=>{
    const p=DB.partite[r.partitaId];
    const ekgI=p ? eurokgIngresso(p) : null;

    return {
      r,
      p,
      kg:+r.kg||0,
      ekgI,
      base:(+r.kg||0)*(ekgI||0)
    };
  });

  const totBase=righe.reduce((s,x)=>s+x.base,0);
  const totKg=righe.reduce((s,x)=>s+x.kg,0);

  const fallbackKg=
    totBase===0 ||
    righe.some(x=>x.ekgI==null);

  righe.forEach(x=>{
    if(!V){
      x.quota=0;
      return;
    }

    if(fallbackKg){
      x.quota=totKg ? V*x.kg/totKg : 0;
    }else{
      x.quota=totBase ? V*x.base/totBase : 0;
    }
  });

  return {
    V,
    righe,
    totBase,
    totKg,
    fallbackKg
  };
}
/* aggregati per partita */
function partitaEconomics(p){
  let ricavo=0;
  let trasportoUscita=0;

  Object.values(DB.documenti).forEach(d=>{
    const rip=ripartizioneDoc(d);
    const ecoDoc=documentoEconomicsData(d);

    const costoTrasp=d.trasportoInterno
      ? 0
      : (+ecoDoc.trasportoCosto||0);

    const totKgDoc=rip.totKg;

    rip.righe.forEach(x=>{
      if(x.r.partitaId===p.id){
        ricavo+=x.quota;

        if(totKgDoc>0){
          trasportoUscita+=costoTrasp*(x.kg/totKgDoc);
        }
      }
    });
  });

  const ecoPartita=partitaEconomicsData(p);

  const acquisto=costoAcquisto(p);

  const traspIng=ecoPartita.trasportoIngresso
    ? (+ecoPartita.trasportoIngresso.importo||0)
    : 0;

  const utile=
    ricavo -
    acquisto -
    traspIng -
    trasportoUscita;

  return {
    ricavo,
    acquisto,
    traspIng,
    trasportoUscita,
    utile
  };
}

/* aggregati annuali */
function annoStats(year){
  const ps = Object.values(DB.partite).filter(p=>p.anno===year);
  let kgIn=0,kgOut=0,acq=0,tin=0,tout=0,ric=0,utile=0,giac=0;
  ps.forEach(p=>{
    kgIn+=p.kgIngresso||0; kgOut+=kgUsciti(p); giac+=giacenza(p);
    const e=partitaEconomics(p);
    acq+=e.acquisto; tin+=e.traspIng; tout+=e.trasportoUscita; ric+=e.ricavo; utile+=e.utile;
  });
  return {n:ps.length,kgIn,kgOut,acq,tin,tout,ric,utile,giac};
}

function traceTree(p){
  let h = `<div class="tree">`;
  h += `<div class="tnode"><div class="tdot"></div><div class="tcard"><div class="tt">Ingresso · ${kg(p.kgIngresso)}</div><div class="ts">CER ${cerLabel(p.cer)} · ${dfmt(p.dataIngresso)}</div></div></div>`;
  (p.lavorazioni||[]).forEach(l=>{
    const fr = l.frazioni&&l.frazioni.length? ' → '+l.frazioni.map(f=>`${f.label} ${kg(f.kg)}`).join(', ') : ` → ${kg(l.pesoDopo)}`;
    h += `<div class="tnode lav"><div class="tdot"></div><div class="tcard"><div class="tt">${l.tipo==='trit'?'Triturazione':'Selezione/cernita'}</div><div class="ts">${kg(l.pesoPrima)}${fr}</div></div></div>`;
  });
  Object.values(DB.documenti).forEach(d=>{
    (d.righe||[]).forEach(r=>{ if(r.partitaId===p.id){
      h += `<div class="tnode out"><div class="tdot"></div><div class="tcard"><div class="tt">Uscita ${d.tipo==='fir'?'FIR':'Annex VII'} · ${kg(r.kg)}</div><div class="ts">${esc(d.destinatario||d.impiantoFinale||'')} · ${dfmt(d.data)}</div></div></div>`;
    }});
  });
  h += `</div>`;
  return h;
}

/* ==================================================================
   REPORT MOVIMENTAZIONI
   ================================================================== */
let REPORT_FILTERS = { anno:'', kinds:{ingresso:true,lavorazione:true,uscita:true}, cer:'', prod:'', dest:'', partita:'', from:'', to:'', q:'' };

function findFrazCer(p, lotKey){
  let cer=p.cer;
  (p.lavorazioni||[]).forEach(l=>{
    (l.frazioni||[]).forEach(fr=>{ if(fr.id===lotKey) cer=fr.cer; });
    if((l.lottoProdotto||l.id+'_out')===lotKey) cer=l.cerProdotto||l.cerOrigine||p.cer;
  });
  return cer;
}

/* costruisce l'elenco piatto di tutte le movimentazioni (ingressi, lavorazioni, uscite) */
function buildMovements(){
  const mv=[];
  Object.values(DB.partite).forEach(p=>{
    mv.push({ kind:'ingresso', date:p.dataIngresso, anno:p.anno, partitaId:p.id, partitaNum:p.num,
      cer:p.cer, kgIn:p.kgIngresso||0, kgOut:0, produttoreId:p.produttoreId, destinatario:'',
      controparte:prodName(p.produttoreId), doc:(p.formulariIngresso||[]).map(f=>f.numero).join(', '),
      docType:'Formulario', valore:(costoAcquisto(p)||null), note:'' });
    (p.lavorazioni||[]).forEach(l=>{
      const after = (l.frazioni&&l.frazioni.length)? l.frazioni.reduce((s,f)=>s+(+f.kg||0),0) : l.pesoDopo;
      mv.push({ kind:'lavorazione', date:l.data, anno:p.anno, partitaId:p.id, partitaNum:p.num,
        cer:p.cer, kgIn:0, kgOut:0, produttoreId:p.produttoreId, destinatario:'',
        controparte:(l.tipo==='trit'?'Triturazione':'Selezione e cernita'), doc:'', docType:'',
        valore:null, note:`${kg(l.pesoPrima)} → ${kg(after)}`+((l.frazioni&&l.frazioni.length)?` · ${l.frazioni.length} frazioni`:'') });
    });
  });
  Object.values(DB.documenti).forEach(d=>{
    const rip=ripartizioneDoc(d);
    rip.righe.forEach(x=>{ if(!x.p)return;
      mv.push({ kind:'uscita', date:d.data, anno:x.p.anno, partitaId:x.p.id, partitaNum:x.p.num,
        cer:(x.r.lotto&&x.r.lotto!=='tq')?findFrazCer(x.p,x.r.lotto):x.p.cer, kgIn:0, kgOut:x.kg,
        produttoreId:x.p.produttoreId, destinatario:d.destinatario||'',
        controparte:d.destinatario||'', doc:d.numero, docType:(d.tipo==='fir'?'FIR':'Annex VII'),
        valore:(uscitaValorizzata(d)?x.quota:null), note:(x.r.saldo?'saldo':'parziale'), docId:d.id });
    });
  });
  mv.sort((a,b)=> new Date(b.date||0)-new Date(a.date||0) || b.partitaNum-a.partitaNum);
  return mv;
}
function filteredMovements(){
  const f=REPORT_FILTERS;
  return buildMovements().filter(m=>{
    if(!f.kinds[m.kind]) return false;
    if(f.anno && String(m.anno)!==String(f.anno)) return false;
    if(f.cer && m.cer!==f.cer) return false;
    if(f.prod && m.produttoreId!==f.prod) return false;
    if(f.dest && m.destinatario!==f.dest) return false;
    if(f.partita && String(m.partitaNum)!==String(f.partita)) return false;
    if(f.from && (!m.date || m.date < f.from)) return false;
    if(f.to && (!m.date || m.date > f.to)) return false;
    if(f.q){ const hay=(m.partitaNum+'-raee '+cerLabel(m.cer)+' '+m.controparte+' '+m.doc+' '+m.note).toLowerCase();
      if(!hay.includes(f.q.toLowerCase())) return false; }
    return true;
  });
}
function distinct(arr){ return [...new Set(arr.filter(x=>x!=null && x!==''))]; }

  const f=REPORT_FILTERS;
  const all=buildMovements();
  const years=distinct(all.map(m=>m.anno)).sort();

  const prods=Object.values(DB.produttori);
  const dests=distinct(all.filter(m=>m.destinatario).map(m=>m.destinatario)).sort();
  const parts=distinct(all.map(m=>m.partitaNum)).sort((a,b)=>a-b);
  const kchk=(k,lab,cls)=>`<label class="chk" style="padding:3px 0"><input type="checkbox" ${f.kinds[k]?'checked':''} onchange="setKind('${k}',this.checked)"> <span class="tag ${cls}" style="pointer-events:none">${lab}</span></label>`;
  document.getElementById('view')._after = renderReportBody;
  return `
  <div class="filters">
    <div class="frow">

}
function exportReportCSV(){
  const rows=filteredMovements();
  const head=['Data','Tipo','Partita','Anno','CER','Descrizione CER','Controparte','Tipo documento','Documento','Kg ingresso','Kg uscita','Valore','Note'];
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const lines=[head.map(q).join(';')];
  rows.forEach(m=>lines.push([m.date||'',m.kind,m.partitaNum+'-Raee',m.anno,cerLabel(m.cer),cerDesc(m.cer),m.controparte||'',m.docType||'',m.doc||'',
    (m.kgIn||''),(m.kgOut||''),(m.valore!=null?m.valore.toFixed(2):''),m.note||''].map(q).join(';')));
  const csv='\ufeff'+lines.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='movimentazioni_Mozzanica_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Report esportato ('+rows.length+' righe)');
}

function lottoStoricoLabel(p,key){
  if(!key || key==='tq') return 'Tal quale non lavorato';
  for(const l of (p.lavorazioni||[])){
    const fr=(l.frazioni||[]).find(x=>x.id===key); if(fr) return fr.label||'Frazione';
    if((l.lottoProdotto||l.id+'_out')===key) return l.lottoProdottoLabel||(l.tipo==='trit'?'Triturato':'Selezionato');
  }
  return key;
}

function traceReportDescriptor(kind,id){
  if(kind==='partita'){

  }
  const d=DB.documenti[id]; if(!d)return null;
  const safe=String(d.numero||d.id).replace(/[^a-z0-9_-]+/gi,'_');
  return {title:'Tracciabilità uscita '+(d.numero||''),file:'tracciabilita_uscita_'+safe,html:reportDocumentoHtml(d)};
}

function printTraceReport(kind,id){

function exportBackup(){
  const payload={format:'valmet-raee-backup',version:2,exportedAt:new Date().toISOString(),data:DB};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});

function chooseBackupFile(){closeModal();const input=document.getElementById('backupFile');input.value='';input.click();}
async function importBackupFile(input){
  const file=input.files&&input.files[0];if(!file)return;
  try{
    const parsed=JSON.parse(await file.text()), data=parsed&&parsed.format==='valmet-raee-backup'?parsed.data:parsed;
    if(!data||typeof data!=='object'||!data.partite||!data.documenti)throw new Error('Formato non riconosciuto');
    if(!window.confirm('Importare questo backup? La situazione attuale sarà conservata come copia locale precedente.'))return;
    DB=normalizeDB(data);if(!save())return;render();toast('Backup importato e sincronizzazione programmata');
  }catch(e){toast('Backup non valido: '+(e.message||e),'err');}
  finally{input.value='';}
}
function restorePreviousLocal(){

/* ---- CER combobox ---- */
function cerCombo(inputId, hiddenId, initCode){
  const init = initCode? cerByCode[initCode] : null;
  return `<div class="combo" id="${inputId}_wrap">
    <input class="inp mono" id="${inputId}" autocomplete="off" placeholder="Cerca CER: codice o descrizione…" value="${init?init.pretty+' — '+esc(init.desc).slice(0,40):''}">
    <input type="hidden" id="${hiddenId}" value="${initCode||''}">
    <div class="list" id="${inputId}_list"></div>
  </div>`;
}
function bindCerCombo(inputId, hiddenId){
  const inp=document.getElementById(inputId), wrap=document.getElementById(inputId+'_wrap'), list=document.getElementById(inputId+'_list');
  let hi=-1, results=[];
  function build(q){
    q=(q||'').toLowerCase().trim();
    const out=[]; let curChap=null;
    CER_DATA.forEach(c=>{
      if(c.chapter){ curChap=c; return; }
      const hay=(c.pretty+' '+c.desc).toLowerCase();
      if(!q || hay.includes(q) || c.code.includes(q.replace(/\s/g,''))){
        if(curChap && (!out.length || out[out.length-1].chapKey!==curChap.code)){
          out.push({chap:true,chapKey:curChap.code,label:'Cap. '+curChap.code+' — '+curChap.desc});
        }
        out.push(c);
      }
    });
    return out.slice(0,60);
  }
  function draw(){
    results=build(inp.value.replace(/ —.*$/,''));
    list.innerHTML = results.map((c,i)=> c.chap
      ? `<div class="opt chap">${esc(c.label)}</div>`
      : `<div class="opt ${i===hi?'hi':''}" data-i="${i}"><span class="c">${c.pretty}${c.hazard?' <span class="star">*</span>':''}</span><span class="d">${esc(c.desc)}</span></div>`).join('')||'<div class="opt" style="color:#888">Nessun risultato</div>';
    list.querySelectorAll('.opt[data-i]').forEach(el=>el.onclick=()=>pick(+el.dataset.i));
  }
  function pick(i){ const c=results[i]; if(!c||c.chap)return; document.getElementById(hiddenId).value=c.code; inp.value=c.pretty+' — '+c.desc.slice(0,50); wrap.classList.remove('open'); }
  inp.onfocus=()=>{ wrap.classList.add('open'); draw(); };
  inp.oninput=()=>{ wrap.classList.add('open'); hi=-1; document.getElementById(hiddenId).value=''; draw(); };
  inp.onkeydown=(e)=>{
    const opts=results.map((c,i)=>c.chap?null:i).filter(x=>x!=null);
    if(e.key==='ArrowDown'){e.preventDefault(); const p=opts.indexOf(hi); hi=opts[Math.min(p+1,opts.length-1)]??opts[0]; draw();}
    else if(e.key==='ArrowUp'){e.preventDefault(); const p=opts.indexOf(hi); hi=opts[Math.max(p-1,0)]??opts[0]; draw();}
    else if(e.key==='Enter'){e.preventDefault(); if(hi>=0)pick(hi);}
    else if(e.key==='Escape'){wrap.classList.remove('open');}
  };
  document.addEventListener('click',e=>{ if(!wrap.contains(e.target)) wrap.classList.remove('open'); });
}

/* ---- VIES lookup ----
   Endpoint REST ufficiale UE. Dal browser è spesso bloccato da CORS:
   in produzione instradare via Cloud Function. Qui: tentativo + fallback. */
async function viesLookup(piva, boxId){
  const box=document.getElementById(boxId);
  let raw=(piva||'').replace(/\s/g,'').toUpperCase();
  let cc=raw.slice(0,2); let num=raw.slice(2);
  if(!/^[A-Z]{2}$/.test(cc)){ cc='IT'; num=raw; } // default Italia
  box.className='vies-box'; box.innerHTML='<div class="t">⏳ Interrogazione VIES…</div>';
  const url=`https://ec.europa.eu/taxation_customs/vies/rest-api/ms/${cc}/vat/${num}`;
  try{
    const res=await fetch(url,{headers:{'Accept':'application/json'}});
    const data=await res.json();
    if(data.isValid){
      box.className='vies-box ok';
      box.innerHTML=`<div class="t">✓ P.IVA valida e attiva (VIES)</div>
        <div style="font-size:12.5px;margin-top:6px">${data.name?'<b>'+esc(data.name)+'</b><br>':''}${data.address?esc(data.address).replace(/\n/g,', '):'<span class="mini">indirizzo non esposto dal servizio</span>'}</div>
        <button class="btn sm" style="margin-top:8px" type="button" onclick="applyVies('${boxId}',${JSON.stringify(JSON.stringify({name:data.name,address:data.address,cc,num})).replace(/"/g,'&quot;')})">Usa questi dati</button>`;
      box._data={name:data.name,address:(data.address||'').replace(/\n/g,', '),valid:true};
    } else {
      box.className='vies-box err';
      box.innerHTML=`<div class="t">✗ P.IVA non valida secondo VIES</div><div class="mini" style="margin-top:4px">Verifica il numero o inserisci l'anagrafica manualmente.</div>`;
    }
  }catch(err){
    box.className='vies-box err';
    box.innerHTML=`<div class="t">⚠ VIES non raggiungibile dal browser</div>
      <div class="mini" style="margin-top:4px">Restrizione CORS: in produzione la verifica va instradata da una Cloud Function. Puoi comunque aprire il controllo ufficiale:</div>
      <a class="btn sm" style="margin-top:8px" href="https://ec.europa.eu/taxation_customs/vies/#/vat-validation" target="_blank" rel="noopener">Apri VIES ufficiale ↗</a>`;
  }
}
function applyVies(boxId, json){
  try{
    const d=JSON.parse(json); const box=document.getElementById(boxId);
    const rs=document.getElementById('an_rs'), ind=document.getElementById('an_ind');
    if(rs && d.name && !rs.value) rs.value=d.name;
    if(ind && d.address) ind.value=(d.address||'').replace(/\n/g,', ');
    toast('Dati VIES applicati');
  }catch(e){}
}

async function saveFattura(pid){
  const p=DB.partite[pid];
  if(!p) return;

  const num=document.getElementById('f_num').value.trim();
  const imp=+document.getElementById('f_imp').value;

  if(!num){
    toast('N. fattura obbligatorio','err');
    return;
  }

  if(!Number.isFinite(imp)||imp<=0){
    toast('Inserisci un importo d’acquisto valido maggiore di zero','err');
    return;
  }

  const files=document.getElementById('f_pdf').files;
  const pdf=[];
  let uploadWarning=false;

  for(const file of files){
    let url=null;
    let path=null;

    if(CLOUD.user&&window.firebaseBridge){
      try{
        const safe=file.name.replace(/[^a-zA-Z0-9._-]+/g,'_');
        path=`registro-mozzanica/fatture/${pid}/${Date.now()}_${safe}`;
        url=await window.firebaseBridge.uploadFile(file,path);
      }catch(e){
        uploadWarning=true;
      }
    }else if(file.size){
      uploadWarning=true;
    }

    pdf.push({
      name:file.name,
      size:file.size,
      url,
      path,
      uploadedAt:url?Date.now():null
    });
  }

  const hadEconomics=!!DB.economics?.partite?.[pid];

  const previousEconomics=hadEconomics
    ? JSON.parse(JSON.stringify(DB.economics.partite[pid]))
    : null;

  const eco=ensurePartitaEconomics(p);

  eco.fattureAcquisto=eco.fattureAcquisto||[];

  eco.fattureAcquisto.push({
    id:uid('ft'),
    numero:num,
    data:document.getElementById('f_data').value,
    importo:imp,
    pdf
  });

  if(!save()){
    if(hadEconomics){
      DB.economics.partite[pid]=previousEconomics;
    }else{
      delete DB.economics.partite[pid];
    }
    return;
  }

  closeModal();
  render();

  toast(
    uploadWarning
      ? 'Fattura salvata; uno o più PDF restano solo come metadati'
      : 'Fattura aggiunta'+(pdf.length?' con PDF cloud':''),
    uploadWarning?'err':''
  );
}
function delFattura(pid,fid){
  const p=DB.partite[pid];
  if(!p) return;

  const hadEconomics=!!DB.economics?.partite?.[pid];

  const previousEconomics=hadEconomics
    ? JSON.parse(JSON.stringify(DB.economics.partite[pid]))
    : null;

  const eco=ensurePartitaEconomics(p);

  eco.fattureAcquisto=(eco.fattureAcquisto||[])
    .filter(f=>f.id!==fid);

  if(!save()){
    if(hadEconomics){
      DB.economics.partite[pid]=previousEconomics;
    }else{
      delete DB.economics.partite[pid];
    }
    return;
  }

  render();
}

function saveLavorazione(pid){
  const p=DB.partite[pid];
  if(!p){ toast('Partita non trovata','err'); return; }
  const tipo=document.getElementById('l_tipo').value;
  const prima=+document.getElementById('l_prima').value;
  const split=document.getElementById('l_split').checked;
  const sourceKey=document.getElementById('l_source').value;
  const source=lottiDisponibili(p).find(l=>l.key===sourceKey);
  if(!source || source.kg<=0.01){ toast('Il lotto selezionato non \u00e8 pi\u00f9 disponibile','err'); return; }
  if(!Number.isFinite(prima) || prima<=0){ toast('Inserisci i kg da lavorare','err'); return; }
  if(prima>source.kg+0.001){ toast('I kg da lavorare superano la disponibilit\u00e0 del lotto ('+kg(source.kg)+')','err'); return; }

  const lav={id:uid('lav'),tipo,data:document.getElementById('l_data').value,pesoPrima:prima,
    kgLavorati:prima,lottoOrigine:sourceKey,lottoOrigineLabel:source.label,cerOrigine:source.cer,partialV2:true};
  if(split){
    const fraz=[];
    document.querySelectorAll('#l_frazlist .sec').forEach(sec=>{
      const i=sec.id.split('_')[1];
      const lab=document.getElementById('fz_lab_'+i)?.value.trim()||'Frazione';
      const fkg=+document.getElementById('fz_kg_'+i)?.value;
      const fcer=document.getElementById('fz_cerval_'+i)?.value||source.cer;
      if(fkg>0) fraz.push({id:lav.id+'_fr_'+i,label:lab,kg:fkg,cer:fcer});
    });
    if(!fraz.length){ toast('Aggiungi almeno una frazione','err'); return; }
    const totFraz=fraz.reduce((s,f)=>s+(+f.kg||0),0);
    if(totFraz>prima+0.001){ toast('Il peso totale delle frazioni supera i kg lavorati','err'); return; }
    lav.frazioni=fraz;
  } else {
    const dopo=+document.getElementById('l_dopo').value;
    if(!Number.isFinite(dopo) || dopo<0 || dopo>prima+0.001){ toast('Il peso ottenuto deve essere compreso tra 0 e i kg lavorati','err'); return; }
    lav.pesoDopo=dopo;
    lav.lottoProdotto=lav.id+'_out';
    lav.lottoProdottoLabel=tipo==='trit'?'Triturato':'Selezionato';
    lav.cerProdotto=source.cer;
  }
  p.lavorazioni=p.lavorazioni||[]; p.lavorazioni.push(lav);
  if(!save()){ p.lavorazioni=p.lavorazioni.filter(x=>x.id!==lav.id); return; }
  closeModal(); render(); toast('Lavorazione parziale registrata; residuo disponibile '+kg(Math.max(0,(lottiDisponibili(p).find(x=>x.key===sourceKey)?.kg||0))));
}
function delLavorazione(pid,lid){
  const p=DB.partite[pid], lav=p&&(p.lavorazioni||[]).find(l=>l.id===lid);
  if(!p || !lav){ toast('Lavorazione non trovata','err'); return; }
  const prodotti=(lav.frazioni&&lav.frazioni.length)?lav.frazioni.map(fr=>fr.id):[lav.lottoProdotto||lav.id+'_out'];
  const usataInUscita=Object.values(DB.documenti).some(d=>(d.righe||[]).some(r=>r.partitaId===pid&&prodotti.includes(r.lotto)));
  const usataDopo=(p.lavorazioni||[]).some(l=>l.id!==lid&&l.partialV2&&prodotti.includes(l.lottoOrigine));
  const idx=(p.lavorazioni||[]).findIndex(l=>l.id===lid);
  const legacyChain=!lav.partialV2 && idx>=0 && idx<(p.lavorazioni||[]).length-1;
  if(usataInUscita || usataDopo || legacyChain){ toast('Impossibile eliminare: il risultato della lavorazione \u00e8 gi\u00e0 stato utilizzato','err'); return; }
  if(!window.confirm('Eliminare questa lavorazione? I kg lavorati torneranno disponibili nel lotto di origine.')) return;
  p.lavorazioni=p.lavorazioni.filter(l=>l.id!==lid);
  if(!save()){ p.lavorazioni.splice(idx,0,lav); return; }
  render(); toast('Lavorazione eliminata e quantit\u00e0 ripristinata');
}

/* ---- ELIMINAZIONE SICURA PARTITA ---- */
function containsReference(value,target,seen){
  if(value===target) return true;
  if(!value || typeof value!=='object') return false;
  seen=seen||new Set();
  if(seen.has(value)) return false;
  seen.add(value);
  return Object.values(value).some(v=>containsReference(v,target,seen));
}
function deletePartita(partitaId){
  const p=DB.partite[partitaId];
  if(!p){ toast('Partita non trovata','err'); return; }

  const reasons=[];
  const docs=Object.values(DB.documenti).filter(d=>(d.righe||[]).some(r=>r.partitaId===partitaId));
  if((p.lavorazioni||[]).length) reasons.push('sono presenti lavorazioni interne');
  if(docs.length) reasons.push('\u00e8 utilizzata in '+docs.length+' document'+(docs.length===1?'o di uscita':'i di uscita'));

  const otherStores=Object.keys(DB).filter(k=>!['partite','documenti','counters'].includes(k) && containsReference(DB[k],partitaId));
  if(otherStores.length) reasons.push('esistono altri record collegati ('+otherStores.join(', ')+')');

  if(reasons.length){
    modal(`<div class="modal"><div class="modal-h"><h3>Impossibile eliminare la partita</h3><button class="x" onclick="closeModal()">&times;</button></div>
      <div class="modal-b"><p style="margin:0 0 10px">La partita <b>${p.num}-Raee ${p.anno}</b> non pu&ograve; essere eliminata in sicurezza perch&eacute;:</p>
      <ul style="margin:0;padding-left:20px">${reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
      <p class="hint" style="margin:12px 0 0">Rimuovi prima le lavorazioni o i documenti indicati e riprova.</p></div>
      <div class="modal-f"><button class="btn" onclick="closeModal()">Chiudi</button></div></div>`);
    toast('Eliminazione bloccata: la partita ha record collegati','err');
    return;
  }

  if(!window.confirm('Stai per eliminare definitivamente questa partita, incluse fatture, formulari e trasporto di ingresso collegati. L\'operazione non \u00e8 reversibile.')) return;

  delete DB.partite[partitaId];
  if(!save()){ DB.partite[partitaId]=p; return; }
  ROUTE={view:'partite',id:null};
  history.replaceState(null,'','#partite');
  render();
  toast('Partita '+p.num+'-Raee eliminata');
}

function saveValor(id){
  const d=DB.documenti[id];

  if(!d){
    toast('Documento non trovato','err');
    return;
  }

  const rawVal=document.getElementById('v_val').value.trim();
  const v=rawVal==='' ? null : +rawVal;
  const natura=document.getElementById('v_natura').value==='costo'
    ? 'costo'
    : 'ricavo';

  const fnum=document.getElementById('v_fnum').value.trim();
  const fdata=document.getElementById('v_fdata').value;

  const hasVal=Number.isFinite(v)&&v>0;

  if(rawVal!==''&&!hasVal){
    toast('Inserisci un importo valido maggiore di zero','err');
    return;
  }

  if(!hasVal&&!fnum){
    toast(
      'Inserisci almeno il valore economico oppure il numero della fattura',
      'err'
    );
    return;
  }

  if(!fnum&&fdata){
    toast(
      'Per registrare la data indica anche il numero della fattura',
      'err'
    );
    return;
  }

  const hadEconomics=!!DB.economics?.documenti?.[id];

  const previousEconomics=hadEconomics
    ? JSON.parse(JSON.stringify(DB.economics.documenti[id]))
    : null;

  const eco=ensureDocumentoEconomics(d);

  eco.valorizzazione=hasVal
    ? {
        valoreRiconosciuto:Math.abs(v),
        natura
      }
    : null;

  eco.naturaEconomicaBozza=natura;

  eco.fatturaCliente=
    natura==='ricavo'&&fnum
      ? {
          numero:fnum,
          data:fdata
        }
      : null;

  eco.fatturaCosto=
    natura==='costo'&&fnum
      ? {
          numero:fnum,
          data:fdata
        }
      : null;

  if(!save()){
    if(hadEconomics){
      DB.economics.documenti[id]=previousEconomics;
    }else{
      delete DB.economics.documenti[id];
    }

    return;
  }

  openDocView(id);
  render();

  toast(
    hasVal
      ? (
          natura==='costo'
            ? 'Costo di uscita registrato'
            : 'Ricavo di uscita registrato'
        )
      : 'Numero fattura salvato: uscita ancora da valorizzare'
  );
}
function deleteDocumento(documentoId){
  const d=DB.documenti[documentoId];
  if(!d){ toast('Documento non trovato','err'); return; }
  if(!window.confirm('Stai per eliminare definitivamente questo documento di uscita. Le quantit\u00e0 delle partite coinvolte torneranno disponibili. L\'operazione non \u00e8 reversibile.')) return;

  /* Giacenze, ricavi, utili e valorizzazioni sono calcolati dai documenti presenti:
     rimuovendo il record vengono quindi ripristinati e ricalcolati automaticamente. */
  delete DB.documenti[documentoId];
  if(!save()){ DB.documenti[documentoId]=d; return; }
  closeModal();
  render();
  toast('Documento eliminato e quantit\u00e0 ripristinate');
}

/* ---------- INIT ---------- */
load();
if(location.hash){ const [v,id]=location.hash.slice(1).split('/'); ROUTE={view:v||'dash',id:id||null}; }
render();
if(window.firebaseBridge)initCloudBridge();

</script>
